name: Release

# Three ways to cut a release:
#   1. Auto:     push a CODE change to main → patch version is bumped in-run
#                and the installer is published (docs/README-only pushes are
#                filtered out by `paths` below).
#   2. Tag push: npm version patch && git push --follow-tags
#   3. One click: Actions → Release → Run workflow (bumps patch itself)
# All paths run the full quality gate, build the NSIS installer, publish it to
# GitHub Releases with the update manifest (latest.yml + blockmap) that
# installed clients poll for, then verify the published release is complete.
#
# Publishing uses the gh CLI, not electron-builder's built-in publisher: that
# publisher has no retry and no resume, so one flaky asset upload (GitHub's
# release-asset API 502s under load — seen on v1.0.1 and v1.0.2) left partial
# releases a rerun could not repair. Building with --publish never and
# uploading with a retryable, clobbering gh loop makes every publish re-runnable.
#
# Note: pushes made with the built-in GITHUB_TOKEN (the in-run version bump and
# the gh-created release tag) never re-trigger workflows — GitHub's platform
# rule against recursion. The `decide` job additionally guards the human
# follow-tags flow so a branch run and its tag run never both publish.
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    # Code paths only: README/docs/LICENSE edits never burn a version.
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/release.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'electron-builder.yml'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'index.html'
  workflow_dispatch:

# Creating/uploading a release needs write access for the default token.
permissions:
  contents: write

# One release at a time; never cancel a half-uploaded release. This also
# serializes queued runs, so post-publish checks see a settled state.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Decides whether this run should publish. Skips are cheap and explicit:
  #   - our own "release vX.Y.Z" bump commits (double-push safety)
  #   - pushes whose HEAD commit is already tagged (the human
  #     `git push --follow-tags` flow lets the tag run own that version).
  #     A plain code push with an OLDER tag for the current version must
  #     still publish — the tag has to point at THIS commit to skip.
  decide:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - id: decide
        shell: bash
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          publish=true
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            if [[ "$HEAD_MESSAGE" == release\ v* ]]; then
              publish=false
              echo "Version-bump commit — nothing to release again."
            else
              version="$(node -p "require('./package.json').version")"
              # Tags for this version whose target IS the pushed commit
              # (annotated tags resolve through the peeled ^{} entry).
              tags="$(git ls-remote --tags origin "refs/tags/v$version" "refs/tags/v$version^{}" || true)"
              if [ -n "$tags" ] && printf '%s\n' "$tags" | grep -q "$HEAD_SHA"; then
                publish=false
                echo "v$version is already tagged at $HEAD_SHA — the tag run owns this version."
              fi
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Decision: publish=$publish (event=${{ github.event_name }}, ref=${{ github.ref }})"

  release:
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Bump patch version (manual runs and main pushes)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        run: |
          npm version patch --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "release v$(node -p "require('./package.json').version")"
          git push

      # The live adb integration tests require a real adb on PATH.
      - name: Install Android platform-tools (for live tests)
        run: |
          Invoke-WebRequest -Uri https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile platform-tools.zip
          Expand-Archive platform-tools.zip -DestinationPath .
          Add-Content -Path $env:GITHUB_PATH -Value "$PWD\platform-tools"

      - name: Install dependencies
        run: npm ci

      # CI=true makes the live install tests (real HTTPS downloads + tar
      # extraction of adb/scrcpy) run here too — the auto-installer is gated
      # on every release.
      - name: Quality gate (full test suite)
        run: npm test
        env:
          CI: 'true'

      # `dist` = typecheck + esbuild main/preload + Vite renderer + NSIS build.
      # --publish never: the release itself is created by the next step, which
      # can retry and resume where electron-builder's publisher could not.
      - name: Build installers (no publish)
        run: npm run dist -- --publish never
        env:
          # No signing certificate on CI: skip certificate discovery.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Create the release (tag lands on this commit) and upload installer +
      # blockmap + latest.yml. --clobber makes a re-run idempotent, and the
      # loop absorbs transient asset-upload failures instead of leaving a
      # half-published release behind.
      - name: Publish to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"
          shopt -s nullglob
          assets=(release/*.exe release/*.exe.blockmap release/latest.yml)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::no built assets found in release/"
            exit 1
          fi
          echo "Publishing ${tag}: ${assets[*]}"
          for attempt in 1 2 3; do
            ok=false
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              if gh release upload "$tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"; then
                ok=true
              fi
            else
              if gh release create "$tag" "${assets[@]}" \
                  --repo "$GITHUB_REPOSITORY" \
                  --target "$GITHUB_SHA" \
                  --title "$tag" \
                  --generate-notes; then
                ok=true
              fi
            fi
            if [ "$ok" = true ]; then
              echo "Published ${tag}."
              exit 0
            fi
            echo "Publish attempt ${attempt} failed — retrying in 15s."
            sleep 15
          done
          echo "::error::failed to publish ${tag} after 3 attempts"
          exit 1

      # The guard proves the published state instead of trusting the previous
      # step: exactly one release for this tag (repairing split duplicates
      # when possible), exe + blockmap + latest.yml present, and latest.yml's
      # version and byte size matching the uploaded exe.
      - name: Verify published release (duplicate guard)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-release.mjs

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: droidbridge-installer
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
