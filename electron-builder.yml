appId: com.droidbridge.desktop
productName: DroidBridge
copyright: Copyright © 2026 DroidBridge contributors

directories:
  output: release
  buildResources: build

# Only the dedicated build output ships — never source, secrets or maps.
files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
  - package.json

asar: true

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
  artifactName: DroidBridge-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: DroidBridge
  deleteAppDataOnUninstall: false
  license: LICENSE
